org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 enables built-in Kotlin by default, which conflicts with the kotlin-android
# plugin + KSP source-set registration. Opt out here; migrate to built-in Kotlin
# before bumping to AGP 10 (which is expected to drop this opt-out).
android.builtInKotlin=false
android.newDsl=false